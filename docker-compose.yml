services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: haire_owner
      POSTGRES_PASSWORD: haire_owner_dev
      POSTGRES_DB: haire
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
